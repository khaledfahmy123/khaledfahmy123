name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&hide_title=true&hide=contribs,stars&icon_color=58A6FF&text_color=8b949e&card_width=400"
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=transparent&hide_title=true&text_color=8b949e&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: ${{ github.repository_owner }}
          theme: transparent
          hide_border: true
          path: profile/streak.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || \
            git commit -m "chore: update GitHub statistics"

          git push
